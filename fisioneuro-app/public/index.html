<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FisioNeuro - Acceso al Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
    .login-card { width: 100%; max-width: 420px; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); background: white; padding: 2rem; }
  </style>
</head>
<body>

  <div class="card login-card">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary"><i class="bi bi-heart-pulse-fill me-2"></i>FisioNeuro</h3>
      <p class="text-muted small">Acceso al Sistema de Gestión Médica</p>
    </div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label fw-bold small">Tipo de Usuario</label>
        <select id="tipoUsuario" class="form-select" onchange="cambiarPlaceholder()">
          <option value="especialista">Administrador / Especialista</option>
          <option value="paciente">Paciente</option>
        </select>
      </div>

      <div class="mb-3">
        <label id="labelIdentificador" class="form-label fw-bold small">Correo Electrónico</label>
        <input type="text" id="identificador" class="form-control" placeholder="admin@fisioneuro.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small">Contraseña / Cédula</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
      </button>
    </form>
  </div>

  <script>
    function cambiarPlaceholder() {
      const tipo = document.getElementById('tipoUsuario').value;
      const label = document.getElementById('labelIdentificador');
      const input = document.getElementById('identificador');

      if (tipo === 'paciente') {
        label.innerText = 'Cédula de Identidad';
        input.placeholder = 'Ingrese su número de cédula';
      } else {
        label.innerText = 'Correo Electrónico';
        input.placeholder = 'admin@fisioneuro.com';
      }
    }

    document.getElementById('formLogin').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const identificador = document.getElementById('identificador').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: identificador, password: password })
        });

        const data = await response.json();
        if (!response.ok) {
          alert(data.error || 'Error en el inicio de sesión');
          return;
        }

        // Guardar sesión activa en el navegador
        localStorage.setItem('usuarioSesion', JSON.stringify(data));

        // Redirección inteligente según el rol devuelto por la base de datos
        if (data.rol === 'paciente') {
          window.location.href = 'paciente.html';
        } else {
          window.location.href = 'especialista.html';
        }

      } catch (err) {
        console.error(err);
        alert('Error de conexión con el servidor.');
      }
    });
  </script>
</body>
</html>
